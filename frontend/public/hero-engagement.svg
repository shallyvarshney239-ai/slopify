<svg width="480" height="320" viewBox="0 0 480 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Git commit engagement visualization">
  <defs>
    <linearGradient id="hg-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="hg-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="hg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- panel bg -->
  <rect width="480" height="320" rx="16" fill="#0f172a"/>
  <rect x="0.5" y="0.5" width="479" height="319" rx="15.5" stroke="rgba(255,255,255,0.08)"/>
  <rect x="0" y="0" width="480" height="3" rx="16" fill="url(#hg-teal)"/>

  <!-- engagement bands -->
  <rect x="48" y="72" width="384" height="56" rx="4" fill="rgba(34,197,94,0.06)"/>
  <rect x="48" y="128" width="384" height="56" rx="4" fill="rgba(234,179,8,0.06)"/>
  <rect x="48" y="184" width="384" height="56" rx="4" fill="rgba(244,63,94,0.06)"/>

  <!-- grid lines -->
  <line x1="48" y1="240" x2="432" y2="240" stroke="rgba(255,255,255,0.08)"/>
  <line x1="48" y1="200" x2="432" y2="200" stroke="rgba(255,255,255,0.04)"/>
  <line x1="48" y1="160" x2="432" y2="160" stroke="rgba(255,255,255,0.04)"/>
  <line x1="48" y1="120" x2="432" y2="120" stroke="rgba(255,255,255,0.04)"/>
  <line x1="48" y1="80" x2="432" y2="80" stroke="rgba(255,255,255,0.04)"/>

  <!-- trend line -->
  <path d="M56 210 C120 195 180 175 240 168 C300 160 360 145 424 130" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.55" fill="none"/>

  <!-- commit dots -->
  <circle cx="72" cy="205" r="5" fill="#f43f5e" opacity="0.9"/>
  <circle cx="98" cy="192" r="4" fill="#f97316" opacity="0.85"/>
  <circle cx="124" cy="188" r="5" fill="#eab308" opacity="0.9"/>
  <circle cx="152" cy="175" r="4" fill="#eab308"/>
  <circle cx="178" cy="170" r="5" fill="#22c55e" opacity="0.9"/>
  <circle cx="206" cy="162" r="4" fill="#22c55e"/>
  <circle cx="234" cy="158" r="5" fill="#eab308"/>
  <circle cx="262" cy="148" r="4" fill="#22c55e"/>
  <circle cx="290" cy="142" r="5" fill="#22c55e" filter="url(#hg-glow)"/>
  <circle cx="318" cy="136" r="4" fill="#eab308"/>
  <circle cx="346" cy="128" r="5" fill="#22c55e"/>
  <circle cx="374" cy="122" r="4" fill="#14b8a6"/>
  <circle cx="402" cy="118" r="5" fill="#22c55e"/>

  <!-- git graph (left) -->
  <path d="M28 248 L28 200 L52 176 L76 200 L76 248" stroke="url(#hg-teal)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <circle cx="28" cy="200" r="5" fill="#0d9488"/>
  <circle cx="52" cy="176" r="5" fill="#14b8a6"/>
  <circle cx="76" cy="200" r="5" fill="#38bdf8"/>
  <circle cx="28" cy="248" r="4" fill="#64748b"/>

  <!-- axis labels -->
  <text x="48" y="262" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">2020</text>
  <text x="200" y="262" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">2023</text>
  <text x="400" y="262" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">2026</text>
  <text x="14" y="88" fill="#64748b" font-family="sans-serif" font-size="9" transform="rotate(-90 14 88)">Score</text>
</svg>
