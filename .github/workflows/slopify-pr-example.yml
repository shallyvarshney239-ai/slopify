name: Slopify PR check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  slopify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Slopify scan
        uses: ./.github/actions/slopify
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          threshold: "0.35"
          post_comment: "true"
          fail_on_slop: "false"
