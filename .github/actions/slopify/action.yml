name: Slopify PR scan
description: Scan pull requests for low cognitive engagement and hollow descriptions
inputs:
  threshold:
    description: Mean commit score below this fails the check
    required: false
    default: "0.35"
  max_commits:
    description: Max commits to analyze from repo history
    required: false
    default: "30"
  post_comment:
    description: Post a summary comment on the PR
    required: false
    default: "true"
  fail_on_slop:
    description: Fail the check when slop signals are detected
    required: false
    default: "true"
  github_token:
    description: GitHub token for API and comments
    required: true
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Slopify backend dependencies
      shell: bash
      run: |
        pip install -r backend/requirements.txt

    - name: Run PR analysis
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        SLOPIFY_PR_FAST: "1"
      run: |
        cd backend
        python scripts/pull_request_cli.py \
          --repo "${{ github.repository }}" \
          --pr "${{ github.event.pull_request.number }}" \
          --output ../pr-report.json \
          --comment-file ../pr-comment.md \
          --max-commits "${{ inputs.max_commits }}" \
          --threshold "${{ inputs.threshold }}" \
          --pr-fast \
          $([ "${{ inputs.fail_on_slop }}" = "true" ] && echo "--fail-on-slop" || true)

    - name: Post PR comment
      if: inputs.post_comment == 'true'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('pr-comment.md', 'utf8');
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            body,
          });
